<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bon de Commande Client</title>
  <style>
    /* Modern, Clean Reset & Styling */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f4f7f6;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      max-width: 650px;
      width: 100%;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    h2 {
      margin-bottom: 20px;
      color: #2c3e50;
      font-size: 24px;
      text-align: center;
    }

    /* Form Fields Styling */
    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 14px;
      color: #555;
    }

    input[type="text"],
    input[type="email"],
    input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #3498db;
      outline: none;
      box-shadow: 0 0 5px rgba(52, 152, 219, 0.2);
    }

    /* Table Styling */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
      margin-top: 20px;
      margin-bottom: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }

    th {
      font-size: 13px;
      color: #771;
      background-color: #fafafa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Buttons */
    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      transition: background 0.2s;
    }

    #addRowBtn {
      background-color: #eef2f5;
      color: #2c3e50;
      padding: 8px 14px;
      font-size: 13px;
      margin-top: 5px;
    }

    #addRowBtn:hover {
      background-color: #dfe4ea;
    }

    .remove-btn {
      background-color: #ffe5e5;
      color: #d63031;
      padding: 8px 12px;
      font-weight: bold;
    }

    .remove-btn:hover {
      background-color: #ff7675;
      color: white;
    }

    #submitBtn {
      width: 100%;
      background-color: #2ecc71;
      color: white;
      padding: 12px;
      margin-top: 20px;
      font-size: 16px;
    }

    #submitBtn:hover {
      background-color: #27ae60;
    }

    /* Success Message Box */
    #successMessage {
      display: none;
      text-align: center;
      padding: 30px;
    }

    #successMessage h2 {
      color: #2ecc71;
      margin-bottom: 10px;
    }

    #successMessage p {
      color: #666;
      margin-bottom: 20px;
    }

    #successMessage button {
      background-color: #3498db;
      color: white;
      padding: 10px 20px;
    }

    #successMessage button:hover {
      background-color: #2980b9;
    }
  </style>
</head>
<body>

  <div class="container">
    <form id="orderForm">
      <h2>Bon de Commande</h2>
      
      <!-- Company Information -->
      <div class="form-group">
        <label>Nom de l'entreprise</label>
        <input type="text" name="company_name" placeholder="Entrez le nom de l'entreprise" required>
      </div>

      <div class="form-group">
        <label>Numéro de téléphone</label>
        <input type="text" name="phone" placeholder="Entrez le numéro de téléphone" required>
      </div>

      <div class="form-group">
        <label>Adresse e-mail</label>
        <input type="email" name="email" placeholder="Entrez l'adresse e-mail" required>
      </div>
      
      <!-- Hidden field for compiled items -->
      <input type="hidden" name="order_items" id="orderItemsInput">

      <!-- Dynamic Items Table -->
      <div class="table-responsive">
        <table id="itemsTable">
          <thead>
            <tr>
              <th>Code Article</th>
              <th>Quantité</th>
              <th style="width: 60px;">Action</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr class="item-row">
              <td><input type="text" class="item-code" placeholder="ex. ART-001" required></td>
              <td><input type="number" class="item-qty" placeholder="1" value="1" min="1" required></td>
              <td><button type="button" class="remove-btn" onclick="removeRow(this)">✕</button></td>
            </tr>
          </tbody>
        </table>
      </div>

      <button type="button" id="addRowBtn">+ Ajouter un autre article</button>
      
      <button type="submit" id="submitBtn">Soumettre la commande</button>
    </form>

    <!-- Hidden Success Message Container -->
    <div id="successMessage">
      <h2>🎉 Commande soumise avec succès !</h2>
      <p>Merci. Votre commande a été enregistrée en toute sécurité et transmise à notre équipe.</p>
      <button onclick="location.reload()">Soumettre une autre commande</button>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "AKfycbwE0MZPtc33NQ1hsPNMEXdGchqdRVDm5EjFq1mmCzZyBuQZwv857FKWAx43o2NvGvdm";

    // Add a new row dynamically
    document.getElementById('addRowBtn').addEventListener('click', function() {
      const tbody = document.getElementById('tableBody');
      const newRow = document.createElement('tr');
      newRow.className = 'item-row';
      newRow.innerHTML = `
        <td><input type="text" class="item-code" placeholder="ex. ART-001" required></td>
        <td><input type="number" class="item-qty" placeholder="1" value="1" min="1" required></td>
        <td><button type="button" class="remove-btn" onclick="removeRow(this)">✕</button></td>
      `;
      tbody.appendChild(newRow);
    });

    // Remove a specific row
    function removeRow(button) {
      const tbody = document.getElementById('tableBody');
      if (tbody.querySelectorAll('.item-row').length > 1) {
        button.closest('tr').remove();
      } else {
        alert("Votre commande doit comporter au moins une ligne d'article.");
      }
    }

    // Handle form submission via fetch()
    document.getElementById('orderForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.textContent = "Envoi en cours...";
      submitBtn.disabled = true;

      // 1. Compile table rows into a string
      let itemsList = [];
      document.querySelectorAll('.item-row').forEach(row => {
        const code = row.querySelector('.item-code').value.trim();
        const qty = row.querySelector('.item-qty').value.trim();
        if (code !== "") {
          itemsList.push(`Article : ${code} (Qté : ${qty})`);
        }
      });
      document.getElementById('orderItemsInput').value = itemsList.join('; ');

      // 2. Format body data as URLSearchParams to avoid CORS redirect errors
      const formData = new FormData(this);
      const searchParams = new URLSearchParams(formData);

      fetch(SCRIPT_URL, {
        method: 'POST',
        body: searchParams
      })
      .then(response => response.json())
      .then(data => {
        if (data.status === "success") {
          document.getElementById('orderForm').style.display = 'none';
          document.getElementById('successMessage').style.display = 'block';
        } else {
          alert("Erreur lors de la soumission de la commande : " + data.message);
          submitBtn.textContent = "Soumettre la commande";
          submitBtn.disabled = false;
        }
      })
      .catch(error => {
        console.error('Erreur :', error);
        document.getElementById('orderForm').style.display = 'none';
        document.getElementById('successMessage').style.display = 'block';
      });
    });
  </script>

</body>
</html>
